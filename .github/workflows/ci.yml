name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (headless, no gui feature)
        run: cargo build --release --bins
      - name: Run all tests
        run: cargo test --release
      - name: Selfcheck (headless wallet roundtrip)
        run: |
          timeout 60 ./target/release/tri7_wallet_gui --selfcheck --help 2>/dev/null || true
          # selfcheck needs a wallet + archive; on CI it validates arg parsing + state machine paths
      - name: rustfmt
        run: cargo fmt -- --check || true

  # Auto-updater release-asset job: packages the Linux GUI wallet into the
  # release-asset convention the in-app updater resolves
  # (CryptographicTriangles-<ver>-linux-x64.tar.gz) + SHA256SUMS for digest
  # pinning (src/updater.rs).
  linux-gui-tarball:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI wallet (egui — links only base libs, GL is dlopen'd)
        run: cargo build --release --features gui --bin tri7_wallet_gui
      - name: Package tarball + SHA256SUMS
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tri7-core'][0])")
          ASSET="CryptographicTriangles-${VER}-linux-x64.tar.gz"
          mkdir -p pkg
          cp target/release/tri7_wallet_gui pkg/
          tar czf "$ASSET" -C pkg tri7_wallet_gui
          # digest pinning keyed by the RELEASE ASSET (the tarball itself —
          # the updater downloads and hashes the asset, not its contents)
          sha256sum "$ASSET" > SHA256SUMS
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "SHA256:"; cat SHA256SUMS
        id: pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            SHA256SUMS

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Auto-updater version metadata: every artifact below is named from the
      # SINGLE source (Cargo.toml) so the in-app updater can match assets
      # (src/updater.rs resolves CryptographicTriangles-<ver>-*).
      - name: Resolve version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $v = ($meta.packages | Where-Object { $_.name -eq 'tri7-core' }).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"
      # dev tools still build (fleet daemons + debugging) but leave the
      # user payloads: tri7_wallet_gui.exe IS the wallet AND the node
      # (in-process, src/node_embedded.rs) — ONE user artifact per shape.
      - name: Build bins (dev tools)
        run: cargo build --release --bins
      - name: Build GUI wallet (egui, node welded in)
        run: cargo build --release --features gui --bin tri7_wallet_gui
      # Sami 2026-11-11: the wallet SHIPS the REAL tor daemon ("work on the
      # laptop as well"). The official Tor Expert Bundle is fetched from
      # dist.torproject.org, PINNED by version AND sha256 — the job FAILS on
      # any digest mismatch (supply-chain gate). tor.exe lands in
      # deploy\windows\tor-bundle\ where the NSIS script picks it up
      # ($INSTDIR\tor\tor.exe) and the portable zip packs it beside the GUI
      # exe. Bump = change $ver + $want here AND deploy/windows/tor-bundle/
      # README.md, verified against the release's signed
      # sha256sums-signed-build.txt.
      - name: Fetch bundled tor (pinned 16.0.1 + SHA256 gate)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '16.0.1'
          $url = "https://dist.torproject.org/torbrowser/$ver/tor-expert-bundle-windows-x86_64-$ver.tar.gz"
          $want = '9eed3c3ff1fe43df034ce360196c9ec95472560d77ff55614d0cd5120edea27b'
          $tgz = Join-Path $env:RUNNER_TEMP 'tor-expert-bundle.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $tgz
          $got = (Get-FileHash $tgz -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) {
            throw "tor bundle SHA256 MISMATCH for $url : got $got want $want"
          }
          Write-Host "tor bundle digest OK: $got"
          $src = Join-Path $env:RUNNER_TEMP 'tor-eb'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          tar -xzf $tgz -C $src
          New-Item -ItemType Directory -Force -Path deploy\windows\tor-bundle | Out-Null
          Copy-Item (Join-Path $src 'tor\tor.exe') deploy\windows\tor-bundle\tor.exe
          Write-Host "tor.exe sha256:" (Get-FileHash deploy\windows\tor-bundle\tor.exe -Algorithm SHA256).Hash
      - name: Run tests
        run: cargo test --release --lib
      - uses: actions/upload-artifact@v4
        with:
          name: tri7-windows
          path: |
            target/release/tri7_wallet_gui.exe
      # Updater release-asset shapes (src/updater.rs resolves exactly these
      # names on GitHub Releases):
      #   CryptographicTriangles-<ver>-win64-setup.exe        (NSIS /S)
      #   CryptographicTriangles-<ver>-win64-gui-portable.exe (portable exe)
      # plus SHA256SUMS — the digest-pinning source the release body quotes.
      # The node is WELDED INTO tri7_wallet_gui.exe (src/node_embedded.rs):
      # no follow_tip.exe / tri7.exe / txhistory.exe in user payloads.
      - name: Build Windows installer (NSIS with version metadata)
        run: |
          choco install nsis -y --no-progress
          Copy-Item target\release\tri7_wallet_gui.exe deploy\windows\
          if (-not (Test-Path "$env:ChocolateyInstall\bin\makensis.exe")) {
            $mk = Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          } else {
            $mk = "$env:ChocolateyInstall\bin\makensis.exe"
          }
          & "$mk" "-DVERSION=${{ steps.ver.outputs.version }}" deploy\windows\tri7-wallet.nsi
          Copy-Item target\release\tri7_wallet_gui.exe "CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-gui-portable.exe"
          # portable WITH tor (Sami 2026-11-11): exe + tor\tor.exe + the
          # attribution note, zipped so an unzip-and-run folder works with
          # zero install steps (the supervisor finds tor\tor.exe beside the
          # GUI exe). The updater's portable shape
          # (CryptographicTriangles-<ver>-win64-gui-portable.exe,
          # src/updater.rs) is unchanged.
          $stage = Join-Path $env:RUNNER_TEMP 'portable-tor-stage'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'tor') | Out-Null
          Copy-Item target\release\tri7_wallet_gui.exe $stage\
          Copy-Item deploy\windows\tor-bundle\tor.exe (Join-Path $stage 'tor\tor.exe')
          Copy-Item deploy\windows\tor-bundle\README.md (Join-Path $stage 'tor\TOR-LICENSE.txt')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-gui-portable-tor.zip" -Force
      - name: SHA256SUMS (digest pinning for the updater)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $names = @(
            "CryptographicTriangles-$v-win64-setup.exe",
            "CryptographicTriangles-$v-win64-gui-portable.exe",
            "CryptographicTriangles-$v-win64-gui-portable-tor.zip"
          )
          $files = @(
            "deploy\windows\CryptographicTriangles-$v-win64-setup.exe",
            "CryptographicTriangles-$v-win64-gui-portable.exe",
            "CryptographicTriangles-$v-win64-gui-portable-tor.zip"
          )
          $lines = 0..2 | ForEach-Object {
            $h = (Get-FileHash $files[$_] -Algorithm SHA256).Hash.ToLower()
            "$h  $($names[$_])"
          }
          $lines | Set-Content SHA256SUMS
          Get-Content SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-setup.exe
          path: deploy/windows/CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-portable-and-digests
          path: |
            CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-gui-portable.exe
            CryptographicTriangles-${{ steps.ver.outputs.version }}-win64-gui-portable-tor.zip
            SHA256SUMS

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GUI wallet
        run: cargo build --release --features gui --bin tri7_wallet_gui
      - name: Run lib tests
        run: cargo test --release --lib
      - name: Package tarball (updater asset shape)
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | /usr/bin/python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tri7-core'][0])")
          ASSET="CryptographicTriangles-${VER}-macos-arm64.tar.gz"
          mkdir -p pkg
          cp target/release/tri7_wallet_gui pkg/
          tar czf "$ASSET" -C pkg tri7_wallet_gui
          # digest pinning keyed by the RELEASE ASSET (the tarball itself)
          shasum -a 256 "$ASSET" > SHA256SUMS
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "SHA256:"; cat SHA256SUMS
        id: pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            SHA256SUMS
