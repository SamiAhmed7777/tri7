[package]
name = "tri7-core"
version = "0.1.0"
edition = "2021"
description = "Modern full-node core for the Triangles chain — replays the legacy chain byte-for-byte"

[build-dependencies]
cc = "1"

[dependencies]
base58 = "0.2"
primitive-types = "0.13"
ripemd = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: legacy RPC parity — getbalance/listunspent amounts must
# survive a JSON round trip bit-exactly (default formatting loses ULPs)
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
