[package]
name = "tri7-core"
version = "0.1.0"
edition = "2021"
description = "Modern full-node core for the Triangles chain — replays the legacy chain byte-for-byte"

[build-dependencies]
cc = "1"

[dependencies]
base58 = "0.2"
primitive-types = "0.13"
ripemd = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: legacy RPC parity — getbalance/listunspent amounts must
# survive a JSON round trip bit-exactly (default formatting loses ULPs)
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
qrcodegen = "1.8"

# GUI (tri7 wallet, phase 6) — opt-in only so headless builds stay lean.
# egui/eframe pinned: 0.29 App-trait API (run_native AppCreator returns Result).
egui = { version = "=0.29.1", optional = true }
eframe = { version = "=0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
], optional = true }
# PNG decode for the legacy Qt asset carry-over (header logo, menu icons)
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
default = []
gui = ["dep:egui", "dep:eframe", "dep:image"]

[profile.release]
opt-level = 3
lto = true
