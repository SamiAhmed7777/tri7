[package]
name = "tri7-core"
version = "7.0.1"
edition = "2021"
description = "Modern full-node core for the Triangles chain — replays the legacy chain byte-for-byte"

[build-dependencies]
cc = "1"
# unconditional: build.rs runs on the HOST even when cross-compiling, so the
# target gate in cfg() would hide it exactly when needed; the runtime
# CARGO_CFG_WINDOWS check inside build.rs decides whether to embed
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
tray-icon = { version = "0.26.1", optional = true }

[[bin]]
name = "tri7"
path = "src/bin/tri7_cli.rs"

[dependencies]
base58 = "0.2"
clap = { version = "4", features = ["derive"] }
primitive-types = "0.13"
ripemd = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
getrandom = "0.2"
# Seed-phrase hygiene (src/seed.rs): mnemonic/passphrase buffers are scrubbed
# on drop — the legacy CleanseWalletString analogue.
zeroize = "1"
rfd = { version = "0.15", optional = true }
arboard = { version = "3", optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: legacy RPC parity — getbalance/listunspent amounts must
# survive a JSON round trip bit-exactly (default formatting loses ULPs)
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# Tor v3 onion CHECKSUM (".onion checksum" || pubkey || version, SHA3-256,
# first 2 bytes) — the encoding needed to reconstruct a gossiped peer's
# .onion hostname from its 32-byte pubkey (src/p2p.rs). The ed25519 keys
# themselves are still generated by tor; this is a text encoding only.
sha3 = "0.10"
qrcodegen = "1.8"

# GUI (tri7 wallet, phase 6) — opt-in only so headless builds stay lean.
# egui/eframe pinned: 0.29 App-trait API (run_native AppCreator returns Result).
egui = { version = "=0.29.1", optional = true }
eframe = { version = "=0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
], optional = true }
# PNG decode for the legacy Qt asset carry-over (header logo, menu icons)
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# Auto-updater (src/updater.rs): HTTPS to api.github.com + release-asset
# downloads. Optional, folded into the gui feature so headless builds (and
# tri7d) never link a TLS stack. rustls + bundled webpki roots: no system
# trust store dependency on Windows.
ureq = { version = "2.12", default-features = false, features = [
    "tls",
], optional = true }
# Tarball payloads for the linux/macos update path (pure rust: miniz_oxide
# backend, no system tar dependency). Always-on so the extraction path is
# unit-tested in the headless suite too.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[features]
default = []
gui = ["dep:egui", "dep:eframe", "dep:image", "dep:rfd", "dep:ureq", "dep:arboard",
       # the system tray icon (Windows target only: tray-icon is a
       # cfg(windows) dependency, so this is a no-op elsewhere)
       "dep:tray-icon"]

[profile.release]
opt-level = 3
lto = true
