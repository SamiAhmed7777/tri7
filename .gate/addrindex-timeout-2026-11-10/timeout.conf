# tri7-addrindex.service — start-timeout drop-in (the change under review)
# Installed as: /etc/systemd/system/tri7-addrindex.service.d/timeout.conf
# Base unit (unchanged): /etc/systemd/system/tri7-addrindex.service
#   [Service] Type=oneshot, ExecStart=/root/tri7/target/release/addrindex_build
#             /var/lib/tri7/blk0001.dat /var/lib/tri7, Nice=10,
#             IOSchedulingClass=idle, TimeoutStartSec=900
# Timer (unchanged): tri7-addrindex.timer — OnBootSec=5min, OnUnitActiveSec=10min,
#             AccuracySec=30s
[Service]
# The catch-up walk exceeds 900 s (~690 blocks behind; index build alone 85-100 s),
# so every walk is TERM-killed at exactly 900 s and the 10-min timer re-fires
# INSTANTLY -> infinite kill/re-fire loop, catch-up never completes.
# 0 disables the start timeout; the walk remains bounded by the fixed tipstate
# oracle snapshot (4600 hashes) and exits when caught up. Nice/idle already
# contain priority. Rollback: remove this file + systemctl daemon-reload.
TimeoutStartSec=0
